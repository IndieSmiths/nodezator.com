
<div class="card p-2 m-2 bg-dark">

    <a href="$urlname">
        <img class="card-img-top" src="$image_src" alt="$image_alt" />
    </a>


    <div class="card-body">
      <a href="$urlname"><h4 class="card-title">$title</h4></a>
      <p class="card-text">$date_info</p>
      <p class="card-text">$description <a href="$urlname">$read_more</a></p>
    </div>

</div>
